services:
  db:
    image: mysql:8.0
    container_name: tatuaje_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "root_password_segura"
      MYSQL_DATABASE: "tatuaje"
      MYSQL_USER: "app_user"
      MYSQL_PASSWORD: "12345"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_v2:/var/lib/mysql

volumes:
  mysql_data_v2:
